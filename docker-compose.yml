services:
  beamdrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beamdrop-qr-transfer
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3055}:${PORT:-3055}"
    environment:
      - PORT=${PORT:-3055}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-150}
      - FILE_TTL_MINUTES=${FILE_TTL_MINUTES:-60}
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - beamdrop_data:/app/uploads

volumes:
  beamdrop_data:
    driver: local
