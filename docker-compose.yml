version: '3.8'

services:
  beamdrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beamdrop-qr-transfer
    restart: unless-stopped
    init: true
    ports:
      - "3055:3055"
    environment:
      - PORT=3055
      - MAX_FILE_SIZE_MB=150
      - FILE_TTL_MINUTES=60
      - PUBLIC_URL=https://qr.fardin.com.bd
    volumes:
      - beamdrop_data:/app/uploads

volumes:
  beamdrop_data:
    driver: local
